<text x="40" y="418" style="font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:500" fill="#2b3150" text-anchor="start" >À chaque impulsion, une interruption lève le drapeau du tube. Toutes les millisecondes, la boucle regarde les deux drapeaux :</text>
<text x="40" y="440" style="font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:500" fill="#2b3150" text-anchor="start" >s’ils sont levés tous les deux (11), une coïncidence est comptée, puis les drapeaux sont baissés. La fenêtre de coïncidence vaut donc 1 ms.</text></svg>